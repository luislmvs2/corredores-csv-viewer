<script>
'use strict';
const STATES={type:'FeatureCollection',features:window.VIEWER_DATA.STATES_FEATURES};
const ZONES={type:'FeatureCollection',features:window.VIEWER_DATA.ZONES_FEATURES};
const VIANEY={type:'FeatureCollection',features:window.VIEWER_DATA.VIANEY_FEATURES};
const sectorCatalog={"9":"Industrial","11":"Office","13":"Retail","15":"Land"};
const relatedStateIds=new Set([...ZONES.features,...VIANEY.features].flatMap(feature=>feature.properties.state_ids));
const allStates=STATES.features.map(f=>[f.properties.id,f.properties.name]).filter(([id])=>relatedStateIds.has(id)).sort((a,b)=>a[1].localeCompare(b[1],'es'));
const selected={sector:new Set(Object.keys(sectorCatalog).map(Number)),state:new Set(allStates.map(x=>x[0]))};
    const byId={zone:new Map(),vianey:new Map()},stateLayers=new Map(),manualHidden={zone:new Set(),vianey:new Set()}; let focused=null, map, zoneLayer, vianeyLayer, focusLayer, hoverTooltip;
function intersects(values, selection){return values.some(value=>selection.has(value));}
function visible(feature){return selected.sector.size>0 && selected.state.size>0 && intersects(feature.properties.sector_ids,selected.sector) && intersects(feature.properties.state_ids,selected.state);}
 function featureDetails(feature){const p=feature.properties;return {source:p.layer,name:entityName(feature,p.layer==='Vianey'?'vianey':'zone'),sectors:p.sector_names.map(escapeHtml).join(', '),states:p.state_names.map(escapeHtml).join(', ') || 'Sin asignación'};}
 function hoverMarkup(feature){const d=featureDetails(feature);return `<strong>${escapeHtml(d.source)}</strong><br>${escapeHtml(d.name)}<br><b>Sectores:</b> ${d.sectors}<br><b>Estados:</b> ${d.states}`;}
 function fixedMarkup(feature){const d=featureDetails(feature);return `<dt>Fuente</dt><dd>${escapeHtml(d.source)}</dd><dt>Nombre</dt><dd>${escapeHtml(d.name)}</dd><dt>Sectores</dt><dd>${d.sectors}</dd><dt>Estados</dt><dd>${d.states}</dd>`;}
function escapeHtml(value){const d=document.createElement('div');d.textContent=value;return d.innerHTML;}
 function populate(group, entries, containerId){const container=document.getElementById(containerId); container.replaceChildren(); for(const [id,name] of entries){const label=document.createElement('label'), box=document.createElement('input');box.type='checkbox';box.checked=true;box.value=id;box.dataset.group=group;box.addEventListener('change',()=>{box.checked?selected[group].add(group==='sector'?Number(id):id):selected[group].delete(group==='sector'?Number(id):id);refresh();});label.append(box,document.createTextNode(name));container.append(label);}}
  function stateStyle(id){return selected.state.has(id)?{color:'#0f172a',weight:4,opacity:1,fill:false,fillOpacity:0}:{color:'#64748b',weight:1.25,opacity:1,fill:false,fillOpacity:0};}
